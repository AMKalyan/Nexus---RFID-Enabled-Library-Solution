name: nexus
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NEXUS_APP_PASSWORD: ${NEXUS_APP_PASSWORD}
      NEXUS_READONLY_PASSWORD: ${NEXUS_READONLY_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    image: nexus-api:${NEXUS_VERSION}
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nexus_app:${NEXUS_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      OWNER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_DIR: /backups
      OUTBOX_DIR: /app/outbox
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - backups:/backups
      - outbox:/app/outbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 12

  web:
    image: nexus-web:${NEXUS_VERSION}
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["${HTTPS_PORT:-8443}:443", "${HTTP_PORT:-8080}:80"]
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}  # used in the HTTP to HTTPS redirect
    volumes:
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }

  devsim:
    # Demonstration only: docker compose --profile demo up -d devsim
    profiles: ["demo"]
    image: nexus-devsim:${NEXUS_VERSION}
    build: { context: ., dockerfile: device-sim/Dockerfile }
    environment:
      SIM_API: http://api:8000/api/v1
      SIM_PANEL_HOST: 0.0.0.0
    ports: ["127.0.0.1:8100:8100"]
    volumes:
      - ./ops/demo-credentials.txt:/ops/demo-credentials.txt:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  backups:
  outbox:
