<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus device simulator</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #1e293b; background: #f8fafc; }
      h1 { color: #4338ca; margin-bottom: 0.25rem; }
      .status { margin-bottom: 1.5rem; color: #475569; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
      form { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; }
      h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin: 0 0 0.75rem; }
      label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; }
      input, select { width: 100%; box-sizing: border-box; padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 4px; }
      button { margin-top: 0.5rem; background: #4f46e5; color: #fff; border: 0; border-radius: 4px; padding: 0.5rem 0.9rem; cursor: pointer; }
      button.secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
      pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Nexus device simulator</h1>
    <div class="status">Link to Nexus: <b>{{STATUS}}</b> · queued events: <b>{{QUEUED}}</b></div>
    <!--RESULT-->
    <div class="grid">
      <form method="post" action="/do/tap">
        <h2>Smart-card reader</h2>
        <label>Reader <input name="device" value="CARD-01" /></label>
        <label>Card UID <input name="value" placeholder="04A1B2C3" required /></label>
        <button>Tap card</button>
      </form>
      <form method="post" action="/do/scan">
        <h2>Staff station</h2>
        <label>Station <input name="device" value="STAFF-01" /></label>
        <label>Tag EPC(s) <input name="value" placeholder="E280…" required /></label>
        <button>Read tag</button>
      </form>
      <form method="post" action="/do/sweep">
        <h2>Handheld inventory</h2>
        <label>Handheld <input name="device" value="HH-01" /></label>
        <label>Shelf <input name="value" value="A-01" /></label>
        <label>Inventory session id <input name="extra" required /></label>
        <button>Sweep shelf (omit 2, add 1 from B-01)</button>
      </form>
      <form method="post" action="/do/gate">
        <h2>Security gate</h2>
        <label>Gate <input name="device" value="GATE-01" /></label>
        <label>Tag EPC <input name="value" placeholder="E280…" required /></label>
        <label>Direction <select name="direction"><option>out</option><option>in</option></select></label>
        <label>Security bit on tag <select name="bit"><option>on</option><option>off</option></select></label>
        <button>Walk through gate</button>
      </form>
      <form method="post" action="/do/heartbeat">
        <h2>Devices</h2>
        <button>Send heartbeat from all devices</button>
      </form>
      <form method="post" action="/do/offline-on">
        <h2>Link to Nexus</h2>
        <button class="secondary">Simulate LMS offline</button>
        <button formaction="/do/offline-off">Restore and replay queue</button>
      </form>
    </div>
  </body>
</html>
